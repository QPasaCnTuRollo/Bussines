<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTER | ELITE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030406; --card: #0b0e14; --accent: #00e5ff; --success: #00ffa3; --danger: #ff3366; --text: #f0f6fc; --border: rgba(255,255,255,0.08); }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; }

        /* HEADER */
        .vmaster-logo { font-size: 3.5rem; font-weight: 800; letter-spacing: 15px; color: #fff; text-shadow: 0 0 30px var(--accent); text-align: center; margin: 20px 0 0; text-transform: uppercase; }
        .date-bar { text-align: center; font-family: 'JetBrains Mono'; color: #555; font-size: 0.9rem; margin-bottom: 10px; }
        .date-bar b { color: var(--accent); }

        /* RADAR DAC7 */
        .dac-box { width: 550px; margin: 10px auto 25px; background: rgba(255,255,255,0.02); padding: 15px 25px; border-radius: 20px; border: 1px solid var(--border); }
        .dac-bar { height: 8px; background: #000; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        #dac-fill { height: 100%; width: 0%; background: var(--success); box-shadow: 0 0 15px var(--success); transition: 1.5s; }

        /* GRID */
        #main-content { display: none; padding: 0 30px; }
        .grid-3 { display: grid; grid-template-columns: 360px 1fr 320px; gap: 25px; height: calc(100vh - 280px); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 30px; padding: 25px; position: relative; }

        /* FORM & BTNS */
        input, select { background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; width: 100%; margin-top: 10px; }
        .btn-core { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        .btn-edit { background: none; border: 1px solid #333; color: #666; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; }
        .btn-edit:hover { border-color: var(--accent); color: var(--accent); }

        /* MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 20000; }
        .modal-content { background: var(--card); border: 1px solid var(--accent); padding: 40px; border-radius: 30px; width: 400px; text-align: center; }

        /* TRANSICIÓN */
        #welcome-screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .logo-img { width: 200px; opacity: 0; transform: scale(0.8); transition: 1s; margin: 0 20px; border-radius: 40px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div id="login-screen" style="position:fixed; inset:0; background:var(--bg); display:flex; justify-content:center; align-items:center; z-index:10001">
        <div style="background:var(--card); padding:50px; border-radius:40px; border:1px solid var(--border); text-align:center; width:360px">
            <h1 style="color:var(--accent); letter-spacing:10px">V-MASTER</h1>
            <input type="password" id="pass" placeholder="PASSWORD">
            <button class="btn-core" onclick="handleLogin()">ACCEDER</button>
        </div>
    </div>

    <div id="welcome-screen">
        <div style="display:flex">
            <img src="logo1.png" id="l1" class="logo-img">
            <img src="logo2.png" id="l2" class="logo-img">
        </div>
        <h2 style="color:var(--accent); letter-spacing:5px; margin-top:40px">BIENVENIDO A V-MASTERS</h2>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">EDITAR REGISTRO</h3>
            <div id="modal-fields"></div>
            <button class="btn-core" onclick="submitEdit()">GUARDAR</button>
            <button class="btn-core" style="background:var(--danger); color:#fff; margin-top:10px" onclick="deleteItem()">ELIMINAR</button>
            <button class="btn-core" style="background:none; color:#555" onclick="closeModal()">CANCELAR</button>
        </div>
    </div>

    <div id="main-content">
        <header>
            <h1 class="vmaster-logo">V-MASTER</h1>
            <div class="date-bar" id="full-date">Cargando fecha...</div>
            <div class="dac-box">
                <div style="display:flex; justify-content:space-between; font-size:0.7rem; font-weight:800">
                    <span>RADAR DAC7</span><span id="dac-status">SEGURO</span>
                </div>
                <div class="dac-bar"><div id="dac-fill"></div></div>
                <div id="dac-text" style="font-size:0.75rem; color:#444; text-align:right">0/30 VENTAS</div>
            </div>
        </header>

        <div class="grid-3">
            <div class="card">
                <div style="display:flex; justify-content:space-between">
                    <small>CUENTA</small>
                    <button class="btn-edit" onclick="openEditAccount()">⚙️ EDITAR</button>
                </div>
                <select id="sel-cuenta" onchange="fetchData()"></select>
                <input type="text" id="art" placeholder="ARTÍCULO">
                <input type="number" id="pc" placeholder="COSTE (€)">
                <input type="number" id="pv" placeholder="VENTA (€)">
                <button class="btn-core" onclick="save()">REGISTRAR</button>
                <div style="margin-top:20px; height:180px; overflow-y:auto">
                    <table style="width:100%; font-size:0.8rem"><tbody id="history"></tbody></table>
                </div>
            </div>

            <div class="card">
                <div style="display:grid; grid-template-columns:repeat(3,1fr); text-align:center; margin-bottom:20px">
                    <div><small>INGRESOS</small><br><b id="t-ganado" style="font-size:1.4rem">0€</b><div id="p-tag" style="display:none; color:var(--success); font-size:0.6rem">EN BENEFICIO</div></div>
                    <div><small>INVERSIÓN</small><br><b id="t-invertido" style="font-size:1.4rem; color:var(--danger)">0€</b></div>
                    <div><small>NETO</small><br><b id="t-beneficio" style="font-size:1.4rem; color:var(--success)">0€</b></div>
                </div>
                <div style="height:320px"><canvas id="mainChart"></canvas></div>
            </div>

            <div class="card">
                <small>LOGÍSTICA GLOBAL</small>
                <input type="number" id="g-inv" placeholder="COSTES STOCK (€)">
                <input type="number" id="g-env" placeholder="COSTES ENVÍO (€)">
                <button class="btn-core" style="background:var(--danger); color:#fff" onclick="updateCosts()">SINCRO</button>
                <button class="btn-core" style="background:none; border:1px solid var(--danger); color:var(--danger); margin-top:40px" onclick="resetAll()">ELIMINAR TODO</button>
            </div>
        </div>
    </div>

    <script>
        const CLAVE = "3F@guqu3";
        let sales = [], mainChart = null, currentEditId = null, editType = '';

        function handleLogin() {
            if(document.getElementById('pass').value === CLAVE) {
                document.getElementById('login-screen').style.display = 'none';
                const ws = document.getElementById('welcome-screen');
                ws.style.display = 'flex';
                setTimeout(() => { document.getElementById('l1').style.opacity = '1'; document.getElementById('l1').style.transform = 'scale(1)'; }, 500);
                setTimeout(() => { document.getElementById('l2').style.opacity = '1'; document.getElementById('l2').style.transform = 'scale(1)'; }, 1000);
                setTimeout(() => { ws.style.display = 'none'; document.getElementById('main-content').style.display = 'block'; init(); }, 3500);
            }
        }

        setInterval(() => {
            const n = new Date();
            const meses = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
            document.getElementById('full-date').innerHTML = `${n.getDate()} DE <b>${meses[n.getMonth()]}</b> DE ${n.getFullYear()} | ${n.toLocaleTimeString()}`;
        }, 1000);

        async function init() {
            const r = await fetch('/api/cuentas');
            const d = await r.json();
            document.getElementById('sel-cuenta').innerHTML = d.map(c => `<option value="${c.id}" data-name="${c.nombre_gmail}">${c.nombre_gmail}</option>`).join('');
            fetchData();
        }

        async function fetchData() {
            const r = await fetch('/api/datos');
            sales = await r.json();
            render();
        }

        function openEditItem(id, art, pc, pv) {
            currentEditId = id; editType = 'item';
            document.getElementById('modal-title').innerText = "EDITAR PRODUCTO";
            document.getElementById('modal-fields').innerHTML = `<input id="m1" value="${art}"><input id="m2" type="number" value="${pc}"><input id="m3" type="number" value="${pv}">`;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openEditAccount() {
            const sel = document.getElementById('sel-cuenta');
            currentEditId = sel.value; editType = 'acc';
            document.getElementById('modal-title').innerText = "EDITAR NOMBRE CUENTA";
            document.getElementById('modal-fields').innerHTML = `<input id="m1" value="${sel.options[sel.selectedIndex].text}">`;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        async function submitEdit() {
            const v1 = document.getElementById('m1').value;
            const body = editType === 'item' ? { articulo: v1, precio_compra: document.getElementById('m2').value, precio_venta: document.getElementById('m3').value } : { nombre_gmail: v1 };
            const url = editType === 'item' ? `/api/editar-item/${currentEditId}` : `/api/editar-cuenta/${currentEditId}`;
            await fetch(url, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            closeModal(); editType === 'acc' ? init() : fetchData();
        }

        async function deleteItem() {
            if(!confirm("¿Eliminar?")) return;
            const url = editType === 'item' ? `/api/eliminar-item/${currentEditId}` : `/api/reset-cuenta/${currentEditId}`;
            await fetch(url, { method: 'DELETE' });
            closeModal(); fetchData();
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        function render() {
            const idC = document.getElementById('sel-cuenta').value;
            const filtered = sales.filter(s => s.id_cuenta == idC).reverse();
            const saved = JSON.parse(localStorage.getItem(`vm_v4_${idC}`)) || {inv: 0, env: 0};
            
            document.getElementById('g-inv').value = saved.inv;
            document.getElementById('g-env').value = saved.env;

            let totalV = 0, labels = [], dataV = [], dataI = [];
            const invG = (parseFloat(saved.inv) || 0) + (parseFloat(saved.env) || 0);

            document.getElementById('history').innerHTML = [...filtered].reverse().map(s => `
                <tr><td>${s.articulo}</td><td style="color:var(--success)">+${s.precio_venta}€</td>
                <td style="text-align:right"><button class="btn-edit" onclick="openEditItem(${s.id},'${s.articulo}',${s.precio_compra},${s.precio_venta})">EDIT</button></td></tr>
            `).join('');

            let acc = 0;
            filtered.forEach((s, i) => { acc += s.precio_venta; labels.push(i+1); dataV.push(acc); dataI.push(invG); });

            const neto = acc - invG;
            document.getElementById('t-ganado').innerText = acc.toFixed(2) + "€";
            document.getElementById('t-invertido').innerText = invG.toFixed(2) + "€";
            document.getElementById('t-beneficio').innerText = neto.toFixed(2) + "€";
            document.getElementById('p-tag').style.display = neto > 0 ? 'block' : 'none';

            const p = Math.min((acc/2000)*100, 100);
            document.getElementById('dac-fill').style.width = p + "%";
            document.getElementById('dac-text').innerText = `${filtered.length}/30 VENTAS | ${acc.toFixed(2)}€`;

            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Ventas', data: dataV, borderColor: '#00ffa3', backgroundColor: 'rgba(0,255,163,0.1)', fill: true, tension: 0.4 },
                        { label: 'Inversión', data: dataI, borderColor: '#ff3366', borderDash: [5,5], pointRadius: 0, fill: false }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' } }, x: { display: false } } }
            });
        }

        async function save() {
            const p = { articulo: document.getElementById('art').value, id_cuenta: document.getElementById('sel-cuenta').value, precio_compra: document.getElementById('pc').value || 0, precio_venta: document.getElementById('pv').value || 0, fecha_venta: new Date().toISOString() };
            await fetch('/api/nuevo', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p) });
            document.getElementById('art').value = ""; fetchData();
        }

        function updateCosts() {
            const id = document.getElementById('sel-cuenta').value;
            localStorage.setItem(`vm_v4_${id}`, JSON.stringify({ inv: document.getElementById('g-inv').value, env: document.getElementById('g-env').value }));
            render();
        }

        async function resetAll() { if(confirm("¿Borrar historial de esta cuenta?")) { await fetch(`/api/reset-cuenta/${document.getElementById('sel-cuenta').value}`, { method: 'DELETE' }); fetchData(); } }
    </script>
</body>
</html>
