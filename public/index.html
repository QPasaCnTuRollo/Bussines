<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTER | Secure Access</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050608; --card: #12151c; --accent: #00d4ff; --success: #00ffa3; --text: #f0f6fc; --border: #262c36; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }

        /* --- PANTALLA DE LOGIN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, #0a192f, #050608);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: all 0.8s cubic-bezier(0.87, 0, 0.13, 1);
        }

        .login-card {
            background: rgba(18, 21, 28, 0.8); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 24px; border: 1px solid var(--border);
            width: 320px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .login-card h2 { font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }
        .login-card h2 span { color: var(--accent); }

        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 0.7rem; color: #8b949e; margin-left: 5px; }

        input { 
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); 
            color: white; padding: 14px; border-radius: 12px; width: 100%; 
            margin-top: 5px; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        .btn-login { 
            background: var(--accent); color: #000; width: 100%; padding: 14px;
            border-radius: 12px; font-weight: 800; border: none; cursor: pointer;
            margin-top: 20px; transition: 0.3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4); }

        /* --- DASHBOARD (Oculto al inicio) --- */
        #main-content {
            opacity: 0; transform: translateY(40px); transition: all 1s ease;
            padding: 20px; display: none;
        }

        /* --- TRANSICIÓN FLUIDA --- */
        .logged-in #login-screen { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        .logged-in #main-content { display: block; opacity: 1; transform: translateY(0); }

        /* Estilos Dashboard (reutilizados) */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid-main { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; }
        .dac7-box { background: var(--card); border: 1px solid var(--border); padding: 15px 25px; border-radius: 20px; margin-bottom: 20px; display: flex; align-items: center; }
        .progress-bg { flex: 1; margin: 0 20px; background: #1c2128; height: 8px; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; transition: 1s ease; width: 0%; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--border); text-align: center; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        tr.item td { padding: 12px 8px; border-bottom: 1px solid var(--border); }
        .badge { background: rgba(0, 212, 255, 0.1); color: var(--accent); padding: 3px 7px; border-radius: 5px; font-size: 0.65rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>V-MASTER<span>.</span></h2>
            <div class="input-group">
                <label>USUARIO / CORREO</label>
                <input type="text" id="user-input" placeholder="Ej: QPasaCnTuRollo">
            </div>
            <div class="input-group">
                <label>CONTRASEÑA</label>
                <input type="password" id="pass-input" placeholder="••••••••">
            </div>
            <button class="btn-login" onclick="checkLogin()">ENTRAR AL SISTEMA</button>
            <p id="error-msg" style="color: var(--danger); font-size: 0.7rem; margin-top: 15px; display: none;">Credenciales incorrectas</p>
        </div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div style="font-size: 1.2rem; font-weight: 800;">Hola, <span id="display-user" style="color:var(--accent)"></span></div>
            <div style="font-size: 0.7rem; color: var(--success);">● SISTEMA CLOUD ACTIVO</div>
        </div>

        <div class="dac7-box">
            <div style="min-width: 140px;">
                <div id="dac-status" style="font-weight: 800; font-size: 0.8rem;">CUENTA SEGURA</div>
                <div id="cuenta-activa" style="font-size: 0.6rem; color: #8b949e;">Selecciona cuenta</div>
            </div>
            <div class="progress-bg"><div id="dac-bar" class="progress-fill"></div></div>
            <div id="dac-text" style="font-weight: 800; font-size: 0.8rem; min-width: 120px; text-align: right;">0€ | 0/30 vtas</div>
        </div>

        <div class="grid-main">
            <div class="card">
                <h3>Nueva Entrada</h3>
                <select id="select-cuenta" onchange="actualizarVistaCuenta()"></select>
                <input type="text" id="art" placeholder="Producto">
                <input type="number" id="pc" placeholder="Compra (€)">
                <input type="number" id="env" placeholder="Envío (€)">
                <input type="number" id="pv" placeholder="Venta (€)">
                <input type="number" id="uni" value="1">
                <button class="btn-login" onclick="guardarProducto()">SUBIR A LA NUBE</button>
            </div>
            <div>
                <div class="stats-row">
                    <div class="stat-card">Ventas<br><span id="s-ventas" style="font-size:1.5rem; font-weight:800">0</span></div>
                    <div class="stat-card">Caja<br><span id="s-caja" style="font-size:1.5rem; font-weight:800">0€</span></div>
                    <div class="stat-card">Neto<br><span id="s-neto" style="font-size:1.5rem; font-weight:800; color:var(--success)">0€</span></div>
                </div>
                <div class="card">
                    <table id="tabla-productos">
                        <thead><tr style="color:#8b949e; font-size:0.65rem; text-align: left;">
                            <th>ARTÍCULO</th><th>GMAIL</th><th>PRECIO</th><th>ACCIÓN</th>
                        </tr></thead>
                        <tbody id="lista-productos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // TUS CREDENCIALES
        const AUTH = {
            user: "QPasaCnTuRollo",
            email: "malorentej@gmail.com",
            pass: "3F@guqu3"
        };

        function checkLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;

            if ((u === AUTH.user || u === AUTH.email) && p === AUTH.pass) {
                document.getElementById('display-user').innerText = AUTH.user;
                document.body.classList.add('logged-in');
                inicializar(); // Arranca la carga de datos de Supabase
            } else {
                const msg = document.getElementById('error-msg');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);
            }
        }

        // --- LÓGICA DE DATOS (Supabase) ---
        let globalData = [];

        async function inicializar() {
            await cargarCuentas();
            await cargarDatos();
        }

        async function cargarCuentas() {
            const res = await fetch('/api/cuentas');
            const cuentas = await res.json();
            document.getElementById('select-cuenta').innerHTML = cuentas.map(c => 
                `<option value="${c.id}">${c.nombre_gmail}</option>`).join('');
        }

        async function cargarDatos() {
            const res = await fetch('/api/datos');
            globalData = await res.json();
            
            let v_total = 0, caja_total = 0, neto_total = 0;
            const tabla = document.getElementById('lista-productos');
            
            tabla.innerHTML = globalData.map(p => {
                const tasaVinted = (p.precio_venta * 0.05) + 0.70;
                const netoItem = (p.precio_venta - tasaVinted - (p.precio_compra + p.envio_pago)) * p.unidades;

                if(p.estado === 'Vendido') {
                    v_total += p.unidades;
                    caja_total += (p.precio_venta * p.unidades);
                    neto_total += netoItem;
                }

                return `<tr class="item">
                    <td><b>${p.articulo}</b></td>
                    <td><span class="badge">${p.cuentas ? p.cuentas.nombre_gmail : '-'}</span></td>
                    <td style="color:var(--success)">${p.precio_venta}€</td>
                    <td>${p.estado === 'Stock' ? `<button onclick="vender(${p.id})">VENDER</button>` : '✅'}</td>
                </tr>`;
            }).join('');

            document.getElementById('s-ventas').innerText = v_total;
            document.getElementById('s-caja').innerText = caja_total.toFixed(2) + '€';
            document.getElementById('s-neto').innerText = neto_total.toFixed(2) + '€';
            actualizarVistaCuenta();
        }

        function actualizarVistaCuenta() {
            const cuentaId = document.getElementById('select-cuenta').value;
            const ventas = globalData.filter(p => p.id_cuenta == cuentaId && p.estado === 'Vendido');
            const num = ventas.length;
            const plata = ventas.reduce((acc, p) => acc + (p.precio_venta * p.unidades), 0);
            
            const porc = (num / 30) * 100;
            document.getElementById('dac-bar').style.width = porc + '%';
            document.getElementById('dac-text').innerText = `${plata.toFixed(0)}€ | ${num}/30 vtas`;
        }

        async function vender(id) {
            await fetch(`/api/vender/${id}`, { method: 'PUT' });
            cargarDatos();
        }

        async function guardarProducto() {
            const data = {
                articulo: document.getElementById('art').value,
                id_cuenta: document.getElementById('select-cuenta').value,
                p_compra: parseFloat(document.getElementById('pc').value),
                envio: parseFloat(document.getElementById('env').value),
                p_venta: parseFloat(document.getElementById('pv').value),
                unidades: parseInt(document.getElementById('uni').value)
            };
            await fetch('/api/nuevo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            cargarDatos();
        }
    </script>
</body>
</html>
