<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTERS | Gestión Financiera</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050608; --card: #0d0f14; --accent: #00d4ff; --success: #00ffa3; --danger: #ff4d4d; --text: #f0f6fc; --border: #1c2128; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

        /* LOGIN Y TRANSICIÓN */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: 0.8s; }
        .login-card { background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); width: 320px; text-align: center; }
        input, select { background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin-top: 10px; box-sizing: border-box; font-family: inherit; }
        
        #welcome-transition { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; transition: 0.5s; }
        .logo-anim { width: 130px; height: 130px; opacity: 0; transform: scale(0.7); border-radius: 20px; border: 2px solid var(--accent); margin: 0 15px; }
        .welcome-text { margin-top: 30px; font-family: 'Source Code Pro', monospace; font-size: 1.4rem; letter-spacing: 6px; opacity: 0; color: var(--accent); }

        /* DASHBOARD */
        #main-content { display: none; opacity: 0; padding: 25px; height: 100vh; overflow-y: auto; transition: 1s; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        .clock { font-family: 'Source Code Pro', monospace; color: var(--accent); font-weight: 700; font-size: 1.1rem; }

        .dac7-radar { background: #0d0f14; padding: 20px; border-radius: 20px; border: 1px solid var(--border); display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
        .progress-container { flex: 1; height: 10px; background: #000; border-radius: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 1.5s ease-in-out; box-shadow: 0 0 15px var(--success); }

        .grid-layout { display: grid; grid-template-columns: 380px 1fr 300px; gap: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 24px; }
        
        .stat-box { text-align: center; padding: 20px; border-radius: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); margin-bottom: 15px; }
        .stat-val { display: block; font-size: 1.8rem; font-weight: 800; }

        .btn-action { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        td { padding: 14px 10px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        
        @keyframes fadeInPop { to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1>V-MASTERS<span style="color:var(--accent)">.</span></h1>
            <input type="text" id="user-input" placeholder="Usuario">
            <input type="password" id="pass-input" placeholder="Contraseña">
            <button class="btn-action" onclick="validarAcceso()">ENTRAR</button>
        </div>
    </div>

    <div id="welcome-transition">
        <div style="display:flex">
            <img src="logo1.png" class="logo-anim" id="l1">
            <img src="logo2.png" class="logo-anim" id="l2">
        </div>
        <div class="welcome-text" id="w-text">V-MASTER BIENVENIDO</div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div>
                <h2 style="margin:0">V-MASTERS <span style="color:var(--accent)">FINANCE</span></h2>
                <div class="clock" id="live-clock">00:00:00</div>
            </div>
            <button class="btn-action" style="width:auto; margin:0; padding:8px 15px; background:none; border:1px solid var(--danger); color:var(--danger)" onclick="location.reload()">CERRAR SESIÓN</button>
        </div>

        <div class="dac7-radar">
            <div style="min-width:180px"><b>RADAR DAC7</b><br><small id="active-account" style="color:var(--accent)">Cuenta...</small></div>
            <div class="progress-container"><div id="dac-bar" class="progress-fill"></div></div>
            <div style="text-align:right; min-width:180px" id="dac-info">0 / 30 | 0€</div>
        </div>

        <div class="grid-layout">
            <div class="card">
                <h3>Añadir Venta Realizada</h3>
                <label>Seleccionar Cuenta</label>
                <select id="sel-cuenta" onchange="updateUI()"></select>
                <input type="text" id="art" placeholder="Producto vendido">
                <input type="number" id="pc" placeholder="Coste del Producto (€)">
                <input type="number" id="env" placeholder="Gasto de Envío (€)">
                <input type="number" id="pv" placeholder="Precio de Venta en Vinted (€)" style="border-color:var(--success)">
                <button class="btn-action" onclick="enviarVenta()">SUBIR A LA NUBE</button>
            </div>

            <div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
                    <div class="stat-box"><small>INGRESOS VINTED</small><span class="stat-val" id="t-ingresos" style="color:var(--accent)">0€</span></div>
                    <div class="stat-box"><small>BENEFICIO NETO</small><span class="stat-val" id="t-neto" style="color:var(--success)">0€</span></div>
                </div>
                <div class="card" style="max-height:450px; overflow-y:auto">
                    <table>
                        <thead><tr><th>PRODUCTO</th><th>CUENTA</th><th>NETO</th><th></th></tr></thead>
                        <tbody id="historial"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <canvas id="profitChart"></canvas>
                <div class="stat-box" style="margin-top:20px; border-color:var(--danger)">
                    <small>TOTAL INVERTIDO</small>
                    <span class="stat-val" id="t-gastos" style="color:var(--danger)">0€</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const AUTH = { user: "QPasaCnTuRollo", pass: "3F@guqu3" };
        let salesData = [];
        let myChart = null;

        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('es-ES');
        }, 1000);

        function validarAcceso() {
            if(document.getElementById('user-input').value === AUTH.user && document.getElementById('pass-input').value === AUTH.pass) {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(iniciarBienvenida, 600);
            } else { alert("Acceso incorrecto"); }
        }

        function iniciarBienvenida() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('welcome-transition').style.display = 'flex';
            setTimeout(() => document.getElementById('l1').style.animation = 'fadeInPop 0.6s forwards', 200);
            setTimeout(() => document.getElementById('l2').style.animation = 'fadeInPop 0.6s forwards', 600);
            setTimeout(() => document.getElementById('w-text').style.opacity = '1', 1200);
            setTimeout(() => {
                document.getElementById('welcome-transition').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('welcome-transition').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    setTimeout(() => document.getElementById('main-content').style.opacity = '1', 50);
                    init();
                }, 600);
            }, 3000);
        }

        async function init() {
            const resC = await fetch('/api/cuentas');
            const dataC = await resC.json();
            document.getElementById('sel-cuenta').innerHTML = dataC.map(c => `<option value="${c.id}">${c.nombre_gmail}</option>`).join('');
            fetchData();
        }

        async function fetchData() {
            const res = await fetch('/api/datos');
            salesData = await res.json();
            updateUI();
        }

        function updateUI() {
            let ingresosTotal = 0, inversionTotal = 0, netoTotal = 0;
            const cuentaID = document.getElementById('sel-cuenta').value;
            
            const filtrados = salesData.filter(s => s.id_cuenta == cuentaID);
            const numVentas = filtrados.length;
            const dineroVentas = filtrados.reduce((acc, s) => acc + (s.precio_venta * s.unidades), 0);

            document.getElementById('historial').innerHTML = salesData.map(s => {
                const inversionI = (s.precio_compra + s.envio_pago) * s.unidades;
                const tasaVinted = (s.precio_venta * 0.05) + 0.70;
                const netoI = (s.precio_venta - tasaVinted - (s.precio_compra + s.envio_pago)) * s.unidades;
                
                ingresosTotal += s.precio_venta * s.unidades;
                inversionTotal += inversionI;
                netoTotal += netoI;

                return `<tr><td><b>${s.articulo}</b></td><td>${s.cuentas?.nombre_gmail}</td><td style="color:var(--success)">${netoI.toFixed(2)}€</td><td><button onclick="eliminar(${s.id})" style="color:var(--danger); background:none; border:none; cursor:pointer">🗑</button></td></tr>`;
            }).join('');

            document.getElementById('t-ingresos').innerText = ingresosTotal.toFixed(2) + "€";
            document.getElementById('t-gastos').innerText = inversionTotal.toFixed(2) + "€";
            document.getElementById('t-neto').innerText = netoTotal.toFixed(2) + "€";

            const porcV = (numVentas / 30) * 100;
            const porcD = (dineroVentas / 2000) * 100;
            const max = Math.max(porcV, porcD);
            document.getElementById('dac-bar').style.width = Math.min(max, 100) + "%";
            document.getElementById('dac-info').innerHTML = `<b>${numVentas}/30 vtas</b> | <b>${dineroVentas.toFixed(2)}/2000€</b>`;
            document.getElementById('dac-bar').style.background = max > 85 ? 'var(--danger)' : 'var(--success)';

            actualizarGrafico(inversionTotal, netoTotal);
        }

        function actualizarGrafico(inv, net) {
            const ctx = document.getElementById('profitChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Invertido', 'Neto'], datasets: [{ data: [inv, net], backgroundColor: ['#ff4d4d', '#00ffa3'], borderWidth: 0 }] },
                options: { cutout: '80%' }
            });
        }

        async function enviarVenta() {
            const payload = {
                articulo: document.getElementById('art').value,
                id_cuenta: document.getElementById('sel-cuenta').value,
                precio_compra: parseFloat(document.getElementById('pc').value) || 0,
                envio_pago: parseFloat(document.getElementById('env').value) || 0,
                precio_venta: parseFloat(document.getElementById('pv').value) || 0,
                unidades: 1
            };
            
            const res = await fetch('/api/nuevo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                document.getElementById('art').value = "";
                document.getElementById('pc').value = "";
                document.getElementById('env').value = "";
                document.getElementById('pv').value = "";
                fetchData();
            }
        }

        async function eliminar(id) {
            if(confirm("¿Eliminar registro?")) {
                await fetch(`/api/eliminar/${id}`, { method: 'DELETE' });
                fetchData();
            }
        }
    </script>
</body>
</html>
