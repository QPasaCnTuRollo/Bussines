<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTER | Neural Link Access</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050608; --card: #10121a; --accent: #00d4ff; --success: #00ffa3; --danger: #ff4d4d; --text: #f0f6fc; --border: #262c36; 
            --terminal-font: 'Source Code Pro', monospace;
        }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

        /* --- PANTALLA DE LOGIN (eDEX-UI Style) --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, #0a192f, #050608);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: all 0.8s cubic-bezier(0.87, 0, 0.13, 1);
        }

        .login-card {
            background: rgba(16, 18, 26, 0.8); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 24px; border: 1px solid var(--border);
            width: 340px; text-align: center; box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            font-family: var(--terminal-font);
        }

        .login-card h2 { font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; color: #fff; }
        .login-card h2 span { color: var(--accent); }

        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 0.6rem; color: var(--accent); opacity: 0.8; margin-left: 5px; }

        input { 
            background: rgba(0,0,0,0.4); border: 1px solid var(--border); 
            color: white; padding: 14px; border-radius: 12px; width: 100%; 
            margin-top: 5px; box-sizing: border-box; transition: 0.3s; font-family: inherit;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        .btn-core { 
            background: transparent; color: var(--accent); width: 100%; padding: 14px;
            border-radius: 12px; font-weight: 700; border: 2px solid var(--accent); cursor: pointer;
            margin-top: 25px; transition: all 0.4s; font-family: inherit;
        }
        .btn-core:hover { background: var(--accent); color: #000; box-shadow: 0 0 25px rgba(0, 212, 255, 0.5); }

        /* --- DASHBOARD Y TRANSICIÓN --- */
        #main-content {
            opacity: 0; transform: scale(1.1); transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 20px; display: none; height: 100%; overflow-y: auto;
        }

        .logged-in #login-screen { transform: translateY(-100%) scale(0.9); opacity: 0; pointer-events: none; }
        .logged-in #main-content { display: block; opacity: 1; transform: scale(1); }

        /* TOP BAR CON FOTOS DE PERFIL */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        .v-masters-zone { display: flex; align-items: center; gap: 12px; }
        .avatar-stack { display: flex; align-items: center; }
        .avatar { 
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); 
            background-size: cover; background-position: center; margin-right: -10px;
            transition: 0.3s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .avatar:hover { transform: translateY(-5px) scale(1.1); z-index: 10; margin-right: 5px; }
        
        /* Logout */
        .btn-logout { background: rgba(255, 77, 77, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 8px 15px; border-radius: 10px; font-size: 0.7rem; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: var(--danger); color: white; }

        /* Resto de estilos del Dashboard... */
        .grid-main { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--border); text-align: center; }
        select { background: #000; color: white; border: 1px solid var(--border); padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>V-MASTER<span>.</span>OS</h2>
            <div class="input-group">
                <label>SYSTEM_USER_ID</label>
                <input type="text" id="user-input" placeholder="User o Email">
            </div>
            <div class="input-group">
                <label>ACCESS_ENCRYPTION_KEY</label>
                <input type="password" id="pass-input" placeholder="••••••••">
            </div>
            <button class="btn-core" onclick="checkLogin()">INITIALIZE LINK</button>
            <p id="error-msg" style="color: var(--danger); font-size: 0.7rem; margin-top: 15px; display: none;">ACCESS_DENIED: Invalid Credentials</p>
        </div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div class="v-masters-zone">
                <div class="avatar-stack">
                    <div class="avatar" style="background-image: url('logo1.png');" title="Profitz Mode"></div>
                    <div class="avatar" style="background-image: url('logo2.png');" title="QPasaCnTuRollo"></div>
                </div>
                <div style="margin-left: 15px;">
                    <div style="font-size: 0.6rem; color: #8b949e;">CONNECTED_MASTER:</div>
                    <div style="font-size: 1.1rem; font-weight: 800; color: var(--accent);">QPasaCnTuRollo</div>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">TERMINATE_SESSION</button>
        </div>

        <div class="grid-main">
            <div class="card">
                <h3 style="margin-top:0">Añadir Stock</h3>
                <select id="select-cuenta"></select>
                <input type="text" id="art" placeholder="Producto">
                <input type="number" id="pc" placeholder="Coste Compra (€)">
                <input type="number" id="env" placeholder="Gasto Envío (€)">
                <input type="number" id="pv" placeholder="Precio Venta (€)">
                <input type="number" id="uni" value="1">
                <button class="btn-core" style="margin-top:10px" onclick="guardarProducto()">SUBIR A LA NUBE</button>
            </div>

            <div>
                <div class="stats-row">
                    <div class="stat-card">Ventas<br><span id="s-ventas" style="font-size:1.5rem; font-weight:800">0</span></div>
                    <div class="stat-card">Caja<br><span id="s-caja" style="font-size:1.5rem; font-weight:800">0€</span></div>
                    <div class="stat-card">Neto<br><span id="s-neto" style="font-size:1.5rem; font-weight:800; color:var(--success)">0€</span></div>
                </div>
                <div class="card">
                    <table style="width:100%; text-align:left;">
                        <tbody id="lista-productos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const AUTH = {
            user: "QPasaCnTuRollo",
            email: "malorentej@gmail.com",
            pass: "3F@guqu3"
        };

        function checkLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;

            if ((u === AUTH.user || u === AUTH.email) && p === AUTH.pass) {
                document.body.classList.add('logged-in');
                sessionStorage.setItem('vmaster_session', 'active');
                inicializar();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('vmaster_session');
            location.reload();
        }

        if(sessionStorage.getItem('vmaster_session')) {
            document.body.classList.add('logged-in');
            inicializar();
        }

        // --- LÓGICA DE DATOS SUPABASE ---
        let globalData = [];
        async function inicializar() {
            await cargarCuentas();
            await cargarDatos();
        }

        async function cargarCuentas() {
            const res = await fetch('/api/cuentas');
            const data = await res.json();
            document.getElementById('select-cuenta').innerHTML = data.map(c => `<option value="${c.id}">${c.nombre_gmail}</option>`).join('');
        }

        async function cargarDatos() {
            const res = await fetch('/api/datos');
            globalData = await res.json();
            const tabla = document.getElementById('lista-productos');
            tabla.innerHTML = globalData.map(p => `
                <tr style="border-bottom: 1px solid var(--border);">
                    <td style="padding:15px"><b>${p.articulo}</b></td>
                    <td>${p.precio_venta}€</td>
                    <td>${p.estado === 'Stock' ? `<button onclick="vender(${p.id})">VENDER</button>` : '✅'}</td>
                </tr>`).join('');
            // Actualizar contadores aquí...
        }

        async function vender(id) {
            await fetch(`/api/vender/${id}`, { method: 'PUT' });
            cargarDatos();
        }

        async function guardarProducto() {
            const data = {
                articulo: document.getElementById('art').value,
                id_cuenta: document.getElementById('select-cuenta').value,
                p_compra: parseFloat(document.getElementById('pc').value),
                envio: parseFloat(document.getElementById('env').value),
                p_venta: parseFloat(document.getElementById('pv').value),
                unidades: parseInt(document.getElementById('uni').value)
            };
            await fetch('/api/nuevo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            cargarDatos();
        }
    </script>
</body>
</html>
