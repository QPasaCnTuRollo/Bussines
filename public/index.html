<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTERS | Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050608; --card: #0d0f14; --accent: #00d4ff; --success: #00ffa3; --danger: #ff4d4d; --text: #f0f6fc; --border: #1c2128; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

        /* LOGIN */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: 1s cubic-bezier(0.7, 0, 0.3, 1); }
        .login-card { background: var(--card); padding: 50px; border-radius: 30px; border: 1px solid var(--border); width: 340px; text-align: center; box-shadow: 0 0 80px rgba(0, 212, 255, 0.05); }
        input, select { background: #000; border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 12px; width: 100%; margin-top: 12px; box-sizing: border-box; transition: 0.3s; font-family: inherit; }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        /* TRANSICIÓN "ELITE BOOT" */
        #welcome-transition { 
            position: fixed; inset: 0; background: var(--bg); display: none; 
            flex-direction: column; justify-content: center; align-items: center; z-index: 999;
        }
        .logo-box { display: flex; gap: 40px; perspective: 1000px; }
        .logo-anim { width: 140px; height: 140px; opacity: 0; transform: rotateY(-90deg); border-radius: 20px; border: 1px solid var(--accent); filter: drop-shadow(0 0 20px rgba(0,212,255,0.4)); }
        .welcome-text { margin-top: 30px; font-family: 'Source Code Pro', monospace; font-size: 1.5rem; letter-spacing: 12px; opacity: 0; color: var(--accent); text-transform: uppercase; font-weight: 700; }
        .scan-line { width: 100%; height: 2px; background: var(--accent); position: absolute; top: -10%; opacity: 0.5; box-shadow: 0 0 20px var(--accent); display: none; }

        /* V-MASTERS INTERFACE */
        #main-content { display: none; opacity: 0; padding: 25px; height: 100vh; overflow-y: auto; transition: 2s ease-out; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        .clock { font-family: 'Source Code Pro', monospace; color: var(--accent); font-weight: 700; font-size: 1.2rem; }

        .dac7-radar { background: #0d0f14; padding: 20px; border-radius: 20px; border: 1px solid var(--border); display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
        .progress-container { flex: 1; height: 10px; background: #000; border-radius: 10px; border: 1px solid #222; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 2.5s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 15px var(--success); }

        .grid-layout { display: grid; grid-template-columns: 380px 1fr 300px; gap: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 24px; }
        .btn-action { background: var(--accent); color: #000; border: none; padding: 18px; border-radius: 14px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-action:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 15px 10px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }

        @keyframes scan { from { top: 0%; } to { top: 100%; } }
        @keyframes flipLogo { to { opacity: 1; transform: rotateY(0deg); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1 style="margin-bottom:40px; font-weight:800">V-MASTERS<span style="color:var(--accent)">_</span></h1>
            <input type="text" id="user-input" placeholder="Usuario">
            <input type="password" id="pass-input" placeholder="Contraseña">
            <button class="btn-action" onclick="validarAcceso()">Entrar al Sistema</button>
        </div>
    </div>

    <div id="welcome-transition">
        <div class="scan-line" id="scanner"></div>
        <div class="logo-box">
            <img src="logo1.png" class="logo-anim" id="l1">
            <img src="logo2.png" class="logo-anim" id="l2">
        </div>
        <div class="welcome-text" id="w-text">V-MASTER BIENVENIDO</div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div>
                <h2 style="margin:0; letter-spacing: -1px;">SISTEMA <span style="color:var(--accent)">V-MASTERS</span></h2>
                <div class="clock" id="live-clock">00:00:00</div>
            </div>
            <button class="btn-action" style="width:auto; margin:0; padding:10px 25px; background:none; border:1px solid var(--danger); color:var(--danger)" onclick="location.reload()">DESCONECTAR</button>
        </div>

        <div class="dac7-radar">
            <div style="min-width:220px"><b>VIGILANCIA DAC7</b><br><small id="active-account" style="color:var(--accent)">Sincronizando...</small></div>
            <div class="progress-container"><div id="dac-bar" class="progress-fill"></div></div>
            <div id="dac-info" style="text-align:right; font-family:'Source Code Pro'; font-size:0.85rem">0/30 | 0.00€</div>
        </div>

        <div class="grid-layout">
            <div class="card">
                <h3 style="margin-top:0">Registro Manual</h3>
                <label style="font-size:0.7rem; color:var(--accent)">CUENTA DE VENTA</label>
                <select id="sel-cuenta" onchange="updateUI()"></select>
                
                <input type="text" id="art" placeholder="Nombre del Producto">
                
                <label style="font-size:0.7rem; color:var(--accent); margin-top:15px; display:block">GASTOS MANUALES</label>
                <input type="number" id="pc" placeholder="Total Invertido (€)">
                <input type="number" id="env" placeholder="Gasto de Envío (€)">
                
                <label style="font-size:0.7rem; color:var(--success); margin-top:15px; display:block">VENTA FINAL</label>
                <input type="number" id="pv" placeholder="Precio Venta en Vinted (€)" style="border-color:var(--success)">
                
                <button class="btn-action" id="btn-save" onclick="enviarVenta()">Subir a la Nube</button>
            </div>

            <div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
                    <div class="card" style="text-align:center"><small>INGRESOS TOTALES</small><br><span id="t-ingresos" style="font-size:1.8rem; font-weight:800; color:var(--accent)">0€</span></div>
                    <div class="card" style="text-align:center"><small>BENEFICIO NETO</small><br><span id="t-neto" style="font-size:1.8rem; font-weight:800; color:var(--success)">0€</span></div>
                </div>
                <div class="card" style="max-height:480px; overflow-y:auto; padding:15px;">
                    <table><tbody id="historial"></tbody></table>
                </div>
            </div>

            <div class="card" style="text-align:center">
                <canvas id="profitChart" style="margin-bottom:25px"></canvas>
                <small>TOTAL INVERTIDO (ACUMULADO)</small><br>
                <span id="t-gastos" style="font-size:1.8rem; font-weight:800; color:var(--danger)">0€</span>
            </div>
        </div>
    </div>

    <script>
        const AUTH = { user: "QPasaCnTuRollo", pass: "3F@guqu3" };
        let salesData = [];
        let myChart = null;

        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('es-ES'); }, 1000);

        function validarAcceso() {
            if(document.getElementById('user-input').value === AUTH.user && document.getElementById('pass-input').value === AUTH.pass) {
                ejecutarAnimacion();
            } else { alert("ACCESO DENEGADO"); }
        }

        function ejecutarAnimacion() {
            const login = document.getElementById('login-screen');
            login.style.opacity = '0';
            login.style.transform = 'scale(1.2)';
            
            setTimeout(() => {
                login.style.display = 'none';
                const trans = document.getElementById('welcome-transition');
                trans.style.display = 'flex';
                document.getElementById('scanner').style.display = 'block';
                document.getElementById('scanner').style.animation = 'scan 2s infinite';
                
                setTimeout(() => { document.getElementById('l1').style.animation = 'flipLogo 0.8s forwards'; }, 300);
                setTimeout(() => { document.getElementById('l2').style.animation = 'flipLogo 0.8s forwards'; }, 600);
                setTimeout(() => { document.getElementById('w-text').style.opacity = '1'; document.getElementById('w-text').style.letterSpacing = '6px'; document.getElementById('w-text').style.transition = '2s'; }, 1200);

                setTimeout(() => {
                    trans.style.opacity = '0';
                    setTimeout(() => {
                        trans.style.display = 'none';
                        const mc = document.getElementById('main-content');
                        mc.style.display = 'block';
                        setTimeout(() => mc.style.opacity = '1', 50);
                        init();
                    }, 800);
                }, 4000);
            }, 800);
        }

        async function init() {
            const resC = await fetch('/api/cuentas');
            const dataC = await resC.json();
            document.getElementById('sel-cuenta').innerHTML = dataC.map(c => `<option value="${c.id}">${c.nombre_gmail}</option>`).join('');
            fetchData();
        }

        async function fetchData() {
            const res = await fetch('/api/datos');
            salesData = await res.json();
            updateUI();
        }

        function updateUI() {
            let ingresosG = 0, inversionG = 0, netoG = 0;
            const cuentaID = document.getElementById('sel-cuenta').value;
            const filtrados = salesData.filter(s => s.id_cuenta == cuentaID);
            
            const numV = filtrados.length;
            const dinV = filtrados.reduce((acc, s) => acc + (s.precio_venta * s.unidades), 0);

            document.getElementById('historial').innerHTML = salesData.map(s => {
                const totalGastoManual = (s.precio_compra + s.envio_pago) * s.unidades;
                const tasaVinted = (s.precio_venta * 0.05) + 0.70;
                const netoItem = (s.precio_venta - tasaVinted - (s.precio_compra + s.envio_pago)) * s.unidades;
                
                ingresosG += s.precio_venta * s.unidades;
                inversionG += totalGastoManual;
                netoG += netoItem;

                return `<tr><td><b>${s.articulo}</b><br><small>${s.cuentas?.nombre_gmail}</small></td><td style="color:var(--success); font-weight:800; text-align:right">${netoItem.toFixed(2)}€</td><td><button onclick="eliminarVenta(${s.id})" style="background:none; border:none; color:var(--danger); cursor:pointer">🗑</button></td></tr>`;
            }).join('');

            document.getElementById('t-ingresos').innerText = ingresosG.toFixed(2) + "€";
            document.getElementById('t-gastos').innerText = inversionG.toFixed(2) + "€";
            document.getElementById('t-neto').innerText = netoG.toFixed(2) + "€";

            const pV = (numV / 30) * 100;
            const pD = (dinV / 2000) * 100;
            const max = Math.max(pV, pD);
            document.getElementById('dac-bar').style.width = Math.min(max, 100) + "%";
            document.getElementById('dac-info').innerHTML = `<b>${numV}/30 vtas</b> | <b>${dinV.toFixed(2)}/2000€</b>`;
            document.getElementById('dac-bar').style.background = max > 85 ? 'var(--danger)' : (max > 50 ? '#ff9f00' : 'var(--success)');

            actualizarGrafico(inversionG, netoG);
        }

        function actualizarGrafico(inv, net) {
            const ctx = document.getElementById('profitChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [inv, net], backgroundColor: ['#ff4d4d', '#00ffa3'], borderWidth: 0 }] },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });
        }

        async function enviarVenta() {
            const btn = document.getElementById('btn-save');
            btn.innerText = "REGISTRANDO...";
            btn.disabled = true;

            const payload = {
                articulo: document.getElementById('art').value,
                id_cuenta: parseInt(document.getElementById('sel-cuenta').value),
                precio_compra: parseFloat(document.getElementById('pc').value) || 0, // Esto es el TOTAL INVERTIDO manual
                envio_pago: parseFloat(document.getElementById('env').value) || 0,    // Esto es el ENVÍO manual
                precio_venta: parseFloat(document.getElementById('pv').value) || 0,
                unidades: 1,
                estado: 'Vendido',
                fecha_venta: new Date().toISOString()
            };

            try {
                const res = await fetch('/api/nuevo', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if(res.ok) {
                    document.getElementById('art').value = "";
                    document.getElementById('pc').value = "";
                    document.getElementById('env').value = "";
                    document.getElementById('pv').value = "";
                    await fetchData();
                } else { alert("Error al guardar en Supabase"); }
            } catch (e) { alert("Error de red"); }
            finally { btn.innerText = "Subir a la Nube"; btn.disabled = false; }
        }

        async function eliminarVenta(id) {
            if(confirm("¿Borrar registro financiero?")) { await fetch(`/api/eliminar/${id}`, { method: 'DELETE' }); fetchData(); }
        }
    </script>
</body>
</html>
