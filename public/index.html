<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTER | Neural System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050608; --card: #10121a; --accent: #00d4ff; --success: #00ffa3; --danger: #ff4d4d; --text: #f0f6fc; --border: #262c36; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

        /* PANTALLA LOGIN */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: 0.8s; }
        .login-card { background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); width: 320px; text-align: center; }
        input { background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin-top: 10px; box-sizing: border-box; }
        .btn-main { background: var(--accent); color: #000; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; margin-top: 20px; }

        /* TRANSICIÓN BIENVENIDA (EDEX-STYLE) */
        #welcome-transition { 
            position: fixed; inset: 0; background: var(--bg); display: none; 
            flex-direction: column; justify-content: center; align-items: center; z-index: 999;
        }
        .logo-container { display: flex; gap: 30px; margin-bottom: 20px; }
        .logo-anim { width: 120px; height: 120px; opacity: 0; transform: scale(0.5); border-radius: 20px; }
        .welcome-text { font-family: 'Source Code Pro', monospace; font-size: 1.5rem; letter-spacing: 5px; opacity: 0; color: var(--accent); }

        /* DASHBOARD */
        #main-content { display: none; opacity: 0; padding: 20px; transition: 1s; height: 100vh; overflow-y: auto; }
        .grid-main { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; }
        
        /* TABLA Y BOTONES */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #8b949e; font-size: 0.7rem; padding: 10px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        .btn-edit { color: var(--accent); background: none; border: 1px solid var(--accent); padding: 4px 8px; border-radius: 5px; cursor: pointer; margin-right: 5px; }
        .btn-del { color: var(--danger); background: none; border: 1px solid var(--danger); padding: 4px 8px; border-radius: 5px; cursor: pointer; }

        /* ANIMACIONES */
        @keyframes fadeInLogo { to { opacity: 1; transform: scale(1); } }
        @keyframes revealText { from { width: 0; opacity: 1; } to { width: 100%; opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>V-MASTER<span>.</span></h2>
            <input type="text" id="user-input" placeholder="Usuario">
            <input type="password" id="pass-input" placeholder="Contraseña">
            <button class="btn-main" onclick="runAuth()">ACCEDER</button>
        </div>
    </div>

    <div id="welcome-transition">
        <div class="logo-container">
            <img src="logo1.png" class="logo-anim" id="l1">
            <img src="logo2.png" class="logo-anim" id="l2">
        </div>
        <div class="welcome-text" id="w-text">V-MASTER BIENVENIDO</div>
    </div>

    <div id="main-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2>Dashboard <span style="color:var(--accent)">Live</span></h2>
            <button class="btn-del" onclick="location.reload()">Cerrar Sesión</button>
        </div>
        <div class="grid-main">
            <div class="card">
                <h3>Nuevo Producto</h3>
                <select id="select-cuenta"></select>
                <input type="hidden" id="edit-id">
                <input type="text" id="art" placeholder="Nombre Artículo">
                <input type="number" id="pc" placeholder="Coste Compra">
                <input type="number" id="pv" placeholder="Precio Venta">
                <input type="number" id="uni" value="1">
                <button class="btn-main" id="btn-save" onclick="guardarProducto()">GUARDAR EN NUBE</button>
            </div>
            <div class="card">
                <table>
                    <thead><tr><th>PRODUCTO</th><th>PRECIO</th><th>ESTADO</th><th>ACCIONES</th></tr></thead>
                    <tbody id="lista-productos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const AUTH = { user: "QPasaCnTuRollo", pass: "3F@guqu3" };

        function runAuth() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;

            if (u === AUTH.user && p === AUTH.pass) {
                startTransition();
            } else { alert("Credenciales incorrectas"); }
        }

        function startTransition() {
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                const transition = document.getElementById('welcome-transition');
                transition.style.display = 'flex';
                
                // Secuencia de animación
                setTimeout(() => { document.getElementById('l1').style.animation = 'fadeInLogo 0.5s forwards'; }, 200);
                setTimeout(() => { document.getElementById('l2').style.animation = 'fadeInLogo 0.5s forwards'; }, 600);
                setTimeout(() => { document.getElementById('w-text').style.opacity = '1'; }, 1200);
                
                // Ir al Dashboard
                setTimeout(() => {
                    transition.style.opacity = '0';
                    setTimeout(() => {
                        transition.style.display = 'none';
                        const main = document.getElementById('main-content');
                        main.style.display = 'block';
                        setTimeout(() => main.style.opacity = '1', 50);
                        inicializar();
                    }, 800);
                }, 3000);
            }, 800);
        }

        async function inicializar() {
            await cargarCuentas();
            await cargarDatos();
        }

        async function cargarCuentas() {
            const res = await fetch('/api/cuentas');
            const data = await res.json();
            document.getElementById('select-cuenta').innerHTML = data.map(c => `<option value="${c.id}">${c.nombre_gmail}</option>`).join('');
        }

        async function cargarDatos() {
            const res = await fetch('/api/datos');
            const data = await res.json();
            const tabla = document.getElementById('lista-productos');
            tabla.innerHTML = data.map(p => `
                <tr>
                    <td>${p.articulo}</td>
                    <td>${p.precio_venta}€</td>
                    <td><span class="badge">${p.estado}</span></td>
                    <td>
                        <button class="btn-edit" onclick="prepararEdicion(${JSON.stringify(p).replace(/"/g, '&quot;')})">✎</button>
                        <button class="btn-del" onclick="eliminarProducto(${p.id})">🗑</button>
                    </td>
                </tr>`).join('');
        }

        function prepararEdicion(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('art').value = p.articulo;
            document.getElementById('pc').value = p.precio_compra;
            document.getElementById('pv').value = p.precio_venta;
            document.getElementById('btn-save').innerText = "ACTUALIZAR CAMBIOS";
        }

        async function eliminarProducto(id) {
            if(confirm('¿Seguro que quieres borrar este producto de la nube?')) {
                // Aquí deberías añadir el endpoint de DELETE en tu server.js
                await fetch(`/api/eliminar/${id}`, { method: 'DELETE' });
                cargarDatos();
            }
        }

        async function guardarProducto() {
            const id = document.getElementById('edit-id').value;
            const url = id ? `/api/editar/${id}` : '/api/nuevo';
            const method = id ? 'PUT' : 'POST';

            const data = {
                articulo: document.getElementById('art').value,
                id_cuenta: document.getElementById('select-cuenta').value,
                p_compra: parseFloat(document.getElementById('pc').value),
                p_venta: parseFloat(document.getElementById('pv').value),
                unidades: parseInt(document.getElementById('uni').value)
            };

            await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            // Resetear formulario
            document.getElementById('edit-id').value = "";
            document.getElementById('btn-save').innerText = "GUARDAR EN NUBE";
            cargarDatos();
        }
    </script>
</body>
</html>
