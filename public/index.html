<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTER | Secure Neural Link</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050608; --card: #10121a; --accent: #00d4ff; --success: #00ffa3; --danger: #ff4d4d; --text: #f0f6fc; --border: #262c36; 
            --terminal-font: 'Source Code Pro', monospace;
        }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

        /* --- PANTALLA DE LOGIN (eDEX-UI Style) --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, #0a192f, #050608);
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            z-index: 1000; opacity: 1; transition: opacity 0.8s ease-out;
        }

        .login-card {
            background: rgba(16, 18, 26, 0.8); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 24px; border: 1px solid var(--border);
            width: 340px; text-align: center; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            font-family: var(--terminal-font);
        }

        .login-card h2 { font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }
        .login-card h2 span { color: var(--accent); }

        .login-card input { 
            background: rgba(0,0,0,0.5); border: 1px solid var(--border); 
            color: #fff; padding: 14px; border-radius: 12px; width: 100%; 
            margin-top: 10px; box-sizing: border-box; font-family: inherit; transition: 0.3s;
        }
        .login-card input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        .btn-core { 
            background: transparent; color: var(--accent); width: 100%; padding: 14px;
            border-radius: 12px; font-weight: 700; border: 2px solid var(--accent); cursor: pointer;
            margin-top: 25px; transition: all 0.3s ease; font-family: inherit;
        }
        .btn-core:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }

        /* --- DASHBOARD (Oculto al inicio) --- */
        #main-content {
            opacity: 0; transform: scale(1.05); transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 20px; display: none; height: 100%; overflow-y: auto;
        }

        /* --- TRANSICIÓN eDEX-UI --- */
        .logged-in #login-screen { 
            animation: edexOut 0.8s forwards ease-in; 
            pointer-events: none;
        }
        .logged-in #main-content { 
            display: block; opacity: 1; transform: scale(1);
        }

        @keyframes edexOut {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1) rotateX(10deg); }
            100% { opacity: 0; transform: scale(1.2) rotateX(20deg); }
        }

        /* --- ESTILOS DASHBOARD --- */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        /* Zona V-MASTERS */
        .vmasters-profiles { display: flex; gap: 10px; align-items: center; }
        .profile-pic { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); background-size: cover; background-position: center; transition: 0.3s; }
        .profile-pic:hover { transform: scale(1.2) rotate(5deg); box-shadow: 0 0 15px var(--accent); }
        .profile-1 { background-image: url('/public/image_5.png'); }
        .profile-2 { background-image: url('/public/image_6.png'); }

        .grid-main { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; }
        
        input, select { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin: 5px 0; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        tr.item td { padding: 12px 8px; border-bottom: 1px solid var(--border); }
        .badge { background: rgba(0, 212, 255, 0.1); color: var(--accent); padding: 3px 7px; border-radius: 5px; font-size: 0.65rem; font-weight: bold; }

        /* Botón Cerrar Sesión */
        .btn-logout { background: rgba(255, 77, 77, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: var(--danger); color: #fff; box-shadow: 0 0 10px var(--danger); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>V-MASTER<span>.</span>LINK</h2>
            <div style="text-align: left; margin-bottom: 15px;">
                <label style="font-size: 0.65rem; color: #8b949e;">KEY_AUTH_ID</label>
                <input type="text" id="user-input" placeholder="[ USER / MAIL ]" autofocus>
            </div>
            <div style="text-align: left; margin-bottom: 15px;">
                <label style="font-size: 0.65rem; color: #8b949e;">KEY_AUTH_PASS</label>
                <input type="password" id="pass-input" placeholder="•••••••••••••">
            </div>
            <button class="btn-core" onclick="checkLogin()">INITIATE NEURAL LINK</button>
            <p id="error-msg" style="color: var(--danger); font-size: 0.7rem; margin-top: 15px; display: none;">❌ ACCESS_DENIED: Invalid Credentials</p>
        </div>
        <div style="font-family: var(--terminal-font); font-size: 0.6rem; color: #30363d; margin-top: 20px;">V-MASTER OS v1.0 | Core [eDEX-UI] | EST: 2023</div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div class="vmasters-profiles">
                <div style="font-size: 0.8rem; font-weight: 600;">ACTIVE V-MASTERS:</div>
                <div class="profile-pic profile-1" title="Profitz Mode Core"></div>
                <div class="profile-pic profile-2" title="QPasaCnTuRollo"></div>
                <div style="font-size: 1rem; font-weight: 800; color:var(--accent); letter-spacing: -1px; margin-left:5px;">QPasaCnTuRollo</div>
            </div>
            <div style="display:flex; align-items:center; gap: 15px;">
                <div style="font-size: 0.7rem; color: var(--success);">● LIVE_SYNC</div>
                <button class="btn-logout" onclick="logout()">LOGOUT_SYSTEM</button>
            </div>
        </div>

        <div class="grid-main">
            </div>
    </div>

    <script>
        // TUS CREDENCIALES (Hardcoded como pediste)
        const AUTH = {
            user: "QPasaCnTuRollo",
            email: "malorentej@gmail.com",
            pass: "3F@guqu3"
        };

        function checkLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;

            if ((u === AUTH.user || u === AUTH.email) && p === AUTH.pass) {
                // Sonar audio de confirmación tipo terminal (opcional)
                new Audio('https://www.soundjay.com/buttons/sounds/button-37.mp3').play().catch(()=>{});
                
                document.body.classList.add('logged-in');
                
                // Guardar estado de login en sessionStorage (dura hasta cerrar la pestaña)
                sessionStorage.setItem('vMaster_auth', 'true');
                
                // Arranca la carga de datos (tu lógica de Supabase preexistente)
                inicializar(); 
            } else {
                const msg = document.getElementById('error-msg');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);
            }
        }

        function logout() {
            sessionStorage.removeItem('vMaster_auth');
            location.reload(); // Recarga la página y vuelve al login
        }

        // Comprobar si ya estaba logueado
        if (sessionStorage.getItem('vMaster_auth') === 'true') {
            document.body.classList.add('logged-in');
            inicializar();
        }

        // ... (Aquí copias y pegas tu lógica existente de guardarProducto, vender, etc.) ...
    </script>
</body>
</html>
