<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTER | Neural Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050608; --card: #10121a; --accent: #00d4ff; --success: #00ffa3; --danger: #ff4d4d; --text: #f0f6fc; --border: #262c36; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

        /* LOGIN */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: 0.8s; }
        .login-card { background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); width: 320px; text-align: center; font-family: 'Source Code Pro', monospace; }

        /* TRANSICIÓN BIENVENIDA */
        #welcome-transition { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; transition: 0.5s; }
        .logo-anim { width: 150px; height: 150px; opacity: 0; transform: scale(0.8); border-radius: 20px; border: 2px solid var(--accent); }
        .welcome-text { margin-top: 20px; font-family: 'Source Code Pro', monospace; font-size: 1.2rem; letter-spacing: 4px; opacity: 0; color: var(--accent); }

        /* DASHBOARD */
        #main-content { display: none; opacity: 0; padding: 20px; height: 100vh; overflow-y: auto; transition: 1s; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .dac7-radar { background: var(--card); padding: 15px 25px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; align-items: center; gap: 20px; }
        .progress-bar { flex: 1; height: 8px; background: #1c2128; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 1s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

        .grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; }
        input, select { background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin-top: 8px; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .btn-v { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 15px; }
        .btn-act { padding: 5px 10px; border-radius: 5px; cursor: pointer; border: 1px solid #333; background: none; color: #fff; font-size: 0.7rem; }
        
        @keyframes pop { to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="color:var(--accent)">V-MASTER_AUTH</h2>
            <input type="text" id="user-input" placeholder="USER_ID">
            <input type="password" id="pass-input" placeholder="PASS_KEY">
            <button class="btn-v" onclick="validar()">INITIALIZE</button>
        </div>
    </div>

    <div id="welcome-transition">
        <div style="display:flex; gap:20px">
            <img src="logo1.png" class="logo-anim" id="l1">
            <img src="logo2.png" class="logo-anim" id="l2">
        </div>
        <div class="welcome-text" id="w-text">V-MASTER BIENVENIDO</div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <h2>V-MASTER <span style="color:var(--accent)">SYSTEM</span></h2>
            <button class="btn-act" style="color:var(--danger)" onclick="location.reload()">CERRAR SESIÓN</button>
        </div>

        <div class="dac7-radar">
            <div><b id="dac-label">SEGURIDAD DAC7</b><br><small id="cuenta-name">Cargando...</small></div>
            <div class="progress-bar"><div id="dac-fill" class="progress-fill"></div></div>
            <div id="dac-info">0/30 vtas</div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Gestión Stock</h3>
                <select id="select-cuenta" onchange="actualizarRadar()"></select>
                <input type="hidden" id="edit-id">
                <input type="text" id="art" placeholder="Nombre Artículo">
                <input type="number" id="pc" placeholder="Coste Compra (€)">
                <input type="number" id="pv" placeholder="Precio Venta (€)">
                <input type="number" id="uni" value="1">
                <button class="btn-v" id="btn-save" onclick="guardar()">GUARDAR EN NUBE</button>
            </div>
            <div class="card">
                <table>
                    <tbody id="lista-productos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const AUTH = { user: "QPasaCnTuRollo", pass: "3F@guqu3" };
        let globalData = [];

        function validar() {
            if(document.getElementById('user-input').value === AUTH.user && document.getElementById('pass-input').value === AUTH.pass) {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(showWelcome, 500);
            } else { alert("Error de acceso"); }
        }

        function showWelcome() {
            document.getElementById('login-screen').style.display = 'none';
            const wt = document.getElementById('welcome-transition');
            wt.style.display = 'flex';
            setTimeout(() => document.getElementById('l1').style.animation = 'pop 0.6s forwards', 200);
            setTimeout(() => document.getElementById('l2').style.animation = 'pop 0.6s forwards', 600);
            setTimeout(() => document.getElementById('w-text').style.opacity = '1', 1200);
            setTimeout(() => {
                wt.style.opacity = '0';
                setTimeout(showDashboard, 500);
            }, 3000);
        }

        function showDashboard() {
            document.getElementById('welcome-transition').style.display = 'none';
            const mc = document.getElementById('main-content');
            mc.style.display = 'block';
            setTimeout(() => mc.style.opacity = '1', 50);
            init();
        }

        async function init() {
            await cargarCuentas();
            await cargarDatos();
        }

        async function cargarCuentas() {
            const r = await fetch('/api/cuentas');
            const d = await r.json();
            document.getElementById('select-cuenta').innerHTML = d.map(c => `<option value="${c.id}">${c.nombre_gmail}</option>`).join('');
        }

        async function cargarDatos() {
            const r = await fetch('/api/datos');
            globalData = await r.json();
            const tabla = document.getElementById('lista-productos');
            tabla.innerHTML = globalData.map(p => `
                <tr>
                    <td><b>${p.articulo}</b><br><small>${p.cuentas ? p.cuentas.nombre_gmail : '-'}</small></td>
                    <td style="color:var(--success)">${p.precio_venta}€</td>
                    <td>
                        <button class="btn-act" onclick="vender(${p.id})">${p.estado === 'Stock' ? 'VENDER' : '✅'}</button>
                        <button class="btn-act" onclick="prepararEdit(${JSON.stringify(p).replace(/"/g, '&quot;')})">✎</button>
                        <button class="btn-act" style="color:var(--danger)" onclick="eliminar(${p.id})">🗑</button>
                    </td>
                </tr>`).join('');
            actualizarRadar();
        }

        function actualizarRadar() {
            const idC = document.getElementById('select-cuenta').value;
            const nombreC = document.getElementById('select-cuenta').options[document.getElementById('select-cuenta').selectedIndex].text;
            const ventas = globalData.filter(p => p.id_cuenta == idC && p.estado === 'Vendido').length;
            const porc = (ventas / 30) * 100;
            document.getElementById('dac-fill').style.width = Math.min(porc, 100) + '%';
            document.getElementById('dac-info').innerText = `${ventas}/30 vtas`;
            document.getElementById('cuenta-name').innerText = nombreC;
            document.getElementById('dac-fill').style.background = porc > 80 ? 'var(--danger)' : 'var(--success)';
        }

        async function guardar() {
            const id = document.getElementById('edit-id').value;
            const body = {
                articulo: document.getElementById('art').value,
                id_cuenta: document.getElementById('select-cuenta').value,
                precio_compra: parseFloat(document.getElementById('pc').value),
                precio_venta: parseFloat(document.getElementById('pv').value),
                unidades: parseInt(document.getElementById('uni').value),
                estado: 'Stock'
            };
            await fetch(id ? `/api/editar/${id}` : '/api/nuevo', {
                method: id ? 'PUT' : 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            document.getElementById('edit-id').value = "";
            document.getElementById('btn-save').innerText = "GUARDAR EN NUBE";
            cargarDatos();
        }

        function prepararEdit(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('art').value = p.articulo;
            document.getElementById('pc').value = p.precio_compra;
            document.getElementById('pv').value = p.precio_venta;
            document.getElementById('btn-save').innerText = "ACTUALIZAR DATOS";
        }

        async function vender(id) { await fetch(`/api/vender/${id}`, {method:'PUT'}); cargarDatos(); }
        async function eliminar(id) { if(confirm('¿Borrar?')) { await fetch(`/api/eliminar/${id}`, {method:'DELETE'}); cargarDatos(); } }
    </script>
</body>
</html>
