<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>V-MASTERS | Terminal Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=Source+Code+Pro:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050608; --card: #0d0f14; --accent: #00d4ff; --success: #00ffa3; --danger: #ff4d4d; --warning: #ffaa00; --text: #f0f6fc; --border: #1c2128; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

        /* TRANSICIÓN MEJORADA */
        #welcome-transition { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .logo-container { display: flex; gap: 30px; align-items: center; justify-content: center; transform: scale(1.4); } /* Logos más grandes */
        .logo-anim { width: 180px; height: 180px; border: 2px solid var(--accent); border-radius: 30px; opacity: 0; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
        .scan-laser { position: absolute; width: 100%; height: 5px; background: var(--accent); box-shadow: 0 0 30px var(--accent); top: 0; animation: laserMove 2s infinite linear; }
        @keyframes laserMove { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        /* PROFIT BADGE */
        #profit-status { font-size: 0.9rem; padding: 4px 12px; border-radius: 20px; font-weight: 800; display: none; }
        .is-profit { background: var(--success); color: #000; display: inline-block !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* MODAL EDICIÓN */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); width: 350px; }

        /* GRID & CARDS */
        #main-content { display: none; padding: 20px; height: 100vh; overflow-y: auto; }
        .grid-3 { display: grid; grid-template-columns: 350px 1fr 300px; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; position: relative; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-edit { background: none; border: 1px solid #333; color: #888; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; }
        
        .stat-box { background: #000; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
        .clock { font-family: 'Source Code Pro'; background: #000; border: 1px solid var(--border); padding: 10px 20px; border-radius: 15px; font-size: 1.4rem; }
    </style>
</head>
<body>

    <div id="login-screen" style="position:fixed; inset:0; background:var(--bg); display:flex; justify-content:center; align-items:center; z-index:1000;">
        <div style="background:var(--card); padding:40px; border-radius:25px; border:1px solid var(--border); text-align:center;">
            <h2>V-MASTERS TERMINAL</h2>
            <input type="text" id="user" placeholder="OPERADOR" style="width:100%; padding:10px; margin:10px 0; background:#000; color:#fff; border:1px solid var(--border);">
            <input type="password" id="pass" placeholder="PASSWORD" style="width:100%; padding:10px; margin:10px 0; background:#000; color:#fff; border:1px solid var(--border);">
            <button class="btn" onclick="login()">INICIAR SISTEMA</button>
        </div>
    </div>

    <div id="welcome-transition">
        <div class="scan-laser"></div>
        <div class="logo-container">
            <img src="logo1.png" id="l1" class="logo-anim">
            <img src="logo2.png" id="l2" class="logo-anim">
        </div>
        <h1 style="color:var(--accent); margin-top:50px; letter-spacing:15px; font-family:'Source Code Pro'">DECODIFICANDO...</h1>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Editar</h3>
            <div id="modal-fields"></div>
            <button class="btn" onclick="updateItem()">GUARDAR CAMBIOS</button>
            <button class="btn" style="background:none; color:var(--danger)" onclick="closeModal()">CANCELAR</button>
        </div>
    </div>

    <div id="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div>
                <span id="day" style="font-size:1.5rem; font-weight:800">00</span>
                <span id="month" style="font-size:2.5rem; font-weight:800; color:var(--accent); margin:0 10px;">MES</span>
                <span id="year">2026</span>
            </div>
            <div class="clock" id="clock">00:00:00</div>
        </div>

        <div class="grid-3">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <h3 style="margin:0">INVENTARIO</h3>
                    <button class="btn-edit" onclick="editCuenta()">EDITAR CUENTA</button>
                </div>
                <select id="sel-cuenta" onchange="fetchData()" style="width:100%; padding:10px; margin:15px 0; background:#000; color:#fff; border:1px solid var(--border);"></select>
                
                <input type="text" id="art" placeholder="Producto">
                <input type="number" id="pc" placeholder="Coste Compra">
                <input type="number" id="pv" placeholder="Venta Vinted">
                <button class="btn" id="save-btn" onclick="save()">REGISTRAR</button>

                <div style="margin-top:20px; max-height:350px; overflow-y:auto">
                    <table style="width:100%; font-size:0.8rem">
                        <tbody id="history"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:15px; margin-bottom:15px">
                    <div class="stat-box">GANADO<br><span id="t-ganado" style="font-size:1.4rem; font-weight:800">0€</span></div>
                    <div class="stat-box">INVERTIDO<br><span id="t-invertido" style="font-size:1.4rem; font-weight:800; color:var(--danger)">0€</span></div>
                    <div class="stat-box">
                        BENEFICIO<br>
                        <span id="t-beneficio" style="font-size:1.4rem; font-weight:800; color:var(--success)">0€</span><br>
                        <span id="profit-status">IN PROFIT</span>
                    </div>
                </div>
                <div style="height:400px; background:#000; border-radius:15px; padding:15px">
                    <canvas id="chart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top:0; color:var(--danger)">LOGÍSTICA GLOBAL</h3>
                <label>Coste Inversión Total (€)</label>
                <input type="number" id="global-inv" placeholder="Suma de stock">
                <label style="display:block; margin-top:15px">Gastos Envío (€)</label>
                <input type="number" id="global-env" placeholder="Suma de envíos">
                <button class="btn" style="background:var(--danger); color:#fff" onclick="updateGlobalCosts()">ACTUALIZAR BALANCE</button>
                
                <div style="margin-top:30px; border-top:1px solid #333; padding-top:20px">
                    <h4 style="margin:0">DAC7 RADAR</h4>
                    <div style="height:10px; background:#000; border-radius:5px; margin:10px 0; overflow:hidden">
                        <div id="dac-fill" style="height:100%; width:0%; background:var(--success); transition:1s"></div>
                    </div>
                    <small id="dac-text">0/30 vtas | 0/2000€</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        const AUTH = { user: "QPasaCnTuRollo", pass: "3F@guqu3" };
        let sales = [], chart = null, editingId = null, currentType = '';

        function login() {
            if(document.getElementById('user').value === AUTH.user && document.getElementById('pass').value === AUTH.pass) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('welcome-transition').style.display = 'flex';
                setTimeout(() => { document.getElementById('l1').style.opacity = '1'; }, 600);
                setTimeout(() => { document.getElementById('l2').style.opacity = '1'; }, 1200);
                setTimeout(() => {
                    document.getElementById('welcome-transition').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    init();
                }, 4000);
            }
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-ES');
            document.getElementById('day').innerText = now.getDate();
            const meses = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
            document.getElementById('month').innerText = meses[now.getMonth()];
        }, 1000);

        async function init() {
            const res = await fetch('/api/cuentas');
            const data = await res.json();
            document.getElementById('sel-cuenta').innerHTML = data.map(c => `<option value="${c.id}" data-name="${c.nombre_gmail}" data-mail="${c.email}">${c.nombre_gmail}</option>`).join('');
            fetchData();
        }

        async function fetchData() {
            const res = await fetch('/api/datos');
            sales = await res.json();
            render();
        }

        function updateGlobalCosts() {
            const idC = document.getElementById('sel-cuenta').value;
            localStorage.setItem(`costs_${idC}`, JSON.stringify({
                inv: document.getElementById('global-inv').value,
                env: document.getElementById('global-env').value
            }));
            render();
        }

        function render() {
            const idC = document.getElementById('sel-cuenta').value;
            const filtered = sales.filter(s => s.id_cuenta == idC).reverse(); // Reversa para que el gráfico vaya de izq a der
            const saved = JSON.parse(localStorage.getItem(`costs_${idC}`)) || {inv: 0, env: 0};
            
            document.getElementById('global-inv').value = saved.inv;
            document.getElementById('global-env').value = saved.env;

            let totalGanado = 0;
            let labels = [], dataGanado = [], dataInvertido = [];
            const invGlobal = (parseFloat(saved.inv) || 0) + (parseFloat(saved.env) || 0);

            document.getElementById('history').innerHTML = [...filtered].reverse().map(s => {
                totalGanado += s.precio_venta;
                return `<tr>
                    <td>${s.articulo}</td>
                    <td style="color:var(--success)">${s.precio_venta}€</td>
                    <td style="text-align:right"><button class="btn-edit" onclick="openEdit(${s.id}, '${s.articulo}', ${s.precio_compra}, ${s.precio_venta})">✎</button></td>
                </tr>`;
            }).join('');

            // Lógica Gráfico (Evolución de izq a der)
            let acumuladoGanado = 0;
            filtered.forEach((s, i) => {
                acumuladoGanado += s.precio_venta;
                labels.push(`Venta ${i+1}`);
                dataGanado.push(acumuladoGanado);
                dataInvertido.push(invGlobal); // Línea roja constante para comparar
            });

            const beneficio = totalGanado - invGlobal;
            document.getElementById('t-ganado').innerText = totalGanado.toFixed(2) + "€";
            document.getElementById('t-invertido').innerText = invGlobal.toFixed(2) + "€";
            document.getElementById('t-beneficio').innerText = beneficio.toFixed(2) + "€";
            
            // Cartel de PROFIT
            const profitBadge = document.getElementById('profit-status');
            beneficio > 0 ? profitBadge.classList.add('is-profit') : profitBadge.classList.remove('is-profit');

            // DAC7
            const vtas = filtered.length;
            const p = Math.max((vtas/30)*100, (totalGanado/2000)*100);
            document.getElementById('dac-fill').style.width = Math.min(p, 100) + "%";
            document.getElementById('dac-text').innerText = `${vtas}/30 vtas | ${totalGanado.toFixed(2)}/2000€`;

            // Gráfico Doble Línea
            const ctx = document.getElementById('chart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Ganancia Acumulada', data: dataGanado, borderColor: '#00ffa3', backgroundColor: 'rgba(0,255,163,0.1)', fill: true, tension: 0.3 },
                        { label: 'Inversión Total', data: dataInvertido, borderColor: '#ff4d4d', borderDash: [5, 5], fill: false, tension: 0 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#1c2128' } }, x: { grid: { display: false } } } }
            });
        }

        // --- FUNCIONES DE EDICIÓN ---
        function openEdit(id, art, pc, pv) {
            editingId = id; currentType = 'product';
            document.getElementById('modal-title').innerText = "Editar Producto";
            document.getElementById('modal-fields').innerHTML = `
                <input id="edit-1" value="${art}" placeholder="Nombre">
                <input id="edit-2" type="number" value="${pc}" placeholder="Compra">
                <input id="edit-3" type="number" value="${pv}" placeholder="Venta">
            `;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function editCuenta() {
            const sel = document.getElementById('sel-cuenta');
            const opt = sel.options[sel.selectedIndex];
            editingId = sel.value; currentType = 'account';
            document.getElementById('modal-title').innerText = "Editar Cuenta Gmail";
            document.getElementById('modal-fields').innerHTML = `
                <input id="edit-1" value="${opt.dataset.name}" placeholder="Nombre">
                <input id="edit-2" value="${opt.dataset.mail}" placeholder="Correo Gmail">
            `;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        async function updateItem() {
            const val1 = document.getElementById('edit-1').value;
            const val2 = document.getElementById('edit-2').value;
            const val3 = document.getElementById('edit-3')?.value;

            let body = currentType === 'product' 
                ? { articulo: val1, precio_compra: val2, precio_venta: val3 }
                : { nombre_gmail: val1, email: val2 };

            const url = currentType === 'product' ? `/api/editar/${editingId}` : `/api/cuentas/${editingId}`;
            await fetch(url, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            closeModal();
            currentType === 'account' ? init() : fetchData();
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        async function save() {
            const payload = {
                articulo: document.getElementById('art').value,
                id_cuenta: document.getElementById('sel-cuenta').value,
                precio_compra: document.getElementById('pc').value,
                precio_venta: document.getElementById('pv').value,
                fecha_venta: new Date().toISOString()
            };
            await fetch('/api/nuevo', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            document.getElementById('art').value = ""; fetchData();
        }
    </script>
</body>
</html>
